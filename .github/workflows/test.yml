# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: test

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.22.2, 24.15.0]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    # Removals necessary due to https://github.com/npm/cli/issues/4828
    # Using `npm i` instead of `npm ci` due to necessarily removed lock file
    - run: rm -f package-lock.json
    - run: rm -Rf node_modules
    # Older bundled npm versions (e.g. npm 10.x on Node 22) can crash with
    # "Cannot read properties of null (reading 'edgesOut')" while building
    # the ideal tree for this peer-dependency graph; newer npm does not.
    # Using `npx npm@latest` rather than `npm install -g npm@latest` avoids
    # a separate npm self-upgrade race (it can delete its own in-use files
    # mid-upgrade and crash with "Cannot find module 'promise-retry'").
    - run: npx --yes npm@latest i
    - run: npm run build --if-present
    - run: npm test
