name: deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          pnpm run build
          pnpm run apidoc
      - name: Assemble
        run: |
          mkdir -p pages/lib/jsdoc-type-pratt-parser/
          cp -r dist/* pages/lib/jsdoc-type-pratt-parser/
          cp -r docs pages/
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: pages
          clean-exclude: |
            index.html
            index.js
            .gitignore
            .editorconfig
            package-lock.json
            package.json
            rollup.config.js
            vendor
